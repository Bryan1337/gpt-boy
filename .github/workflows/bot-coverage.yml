name: bot-coverage

on:
    push:
        paths:
            - "bot/**"
            - "shared/**"
            - ".github/workflows/bot-coverage.yml"
    pull_request:
        paths:
            - "bot/**"
            - "shared/**"
            - ".github/workflows/bot-coverage.yml"

permissions:
    contents: write

jobs:
    coverage:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: yarn
                  cache-dependency-path: |
                      bot/yarn.lock
                      yarn.lock

            - name: Install dependencies
              run: yarn --cwd bot install

            - name: Run coverage
              run: yarn --cwd bot test:coverage

            - name: Extract coverage
              id: coverage
              run: |
                  node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('bot/coverage/coverage-summary.json','utf8'));const pct=s.total.lines.pct;console.log('coverage=' + pct.toFixed(2) + '%')" >> $GITHUB_OUTPUT

            - name: Update badge
              uses: emibcn/badge-action@v2
              with:
                  label: bot coverage
                  status: ${{ steps.coverage.outputs.coverage }}
                  label-color: "555"
                  color: green
                  path: badges/bot-coverage.svg

            - name: Bump badge cache buster
              if: github.event_name == 'push'
              run: |
                  python - <<'PY'
                  import os
                  import re
                  from pathlib import Path

                  readme = Path("README.md")
                  if not readme.exists():
                      raise SystemExit(0)

                  run_number = os.environ.get("GITHUB_RUN_NUMBER", "1")
                  text = readme.read_text()
                  text = re.sub(
                      r"(badges/bot-coverage\.svg)(\?v=\d+)?",
                      lambda m: f"{m.group(1)}?v={run_number}",
                      text,
                  )
                  readme.write_text(text)
                  PY

            - name: Commit badge
              if: github.event_name == 'push'
              run: |
                  if [[ -n "$(git status --porcelain badges)" ]]; then
                    git config user.name "github-actions[bot]"
                    git config user.email "github-actions[bot]@users.noreply.github.com"
                    git add badges/bot-coverage.svg README.md
                    git commit -m ":label: Update bot coverage badge"
                    git push
                  fi
